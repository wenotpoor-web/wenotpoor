<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register Your Copy · WE NOT POOR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css?v=wnp16" />
</head>

<body class="wnp">

  <a href="index.html" class="top-login"><span>Back to Home</span></a>

  <main class="wrap">
    <header class="hero">
      <div class="brand-wrap brand-offset">
        <span class="brand">WE NOT POOR</span>
        <span class="brand-accent" aria-hidden="true"></span>
      </div>
      <h1>REGISTER YOUR COPY</h1>
      <p class="sub">This is the point where commitment replaces curiosity.</p>
    </header>

    <section class="card register-card">
      <div class="field book-code-field">
        <span>Book Code <span class="req">*</span></span>
        <input id="code" type="text" placeholder="WNP-XXXX-XXXX" autocomplete="off"
               autocapitalize="characters" spellcheck="false" />
      </div>

      <div class="field book-code-field" style="margin-top:14px;">
        <span>Email <span class="req">*</span></span>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="actions actions-stack">
        <button class="btn" id="continueBtn" type="button">CONTINUE</button>
        <a class="btn ghost" href="member.html">BACK</a>
      </div>

      <p id="msg" class="note center-note" style="min-height:18px;"></p>
      <p class="note center-note">One copy. One entry. Not transferable.</p>
    </section>
  </main>

  <style>
    .register-card{max-width:520px;margin:0 auto;padding:22px 20px 24px}
    .book-code-field{max-width:420px;margin:0 auto}
    .book-code-field input{width:100%}
    .actions-stack{display:flex;flex-direction:column;gap:12px;margin-top:16px;align-items:center}
    .center-note{text-align:center;margin-top:14px}
    @media (max-width:520px){.register-card{max-width:100%}.book-code-field{max-width:100%}}
    .brand-wrap{display:inline-flex;flex-direction:column;gap:4px}
    .brand-offset{align-items:flex-start}
    .brand-accent{display:block;width:36px;height:3px;background:var(--danger,#FF2A2A);border-radius:999px;margin-left:2px}
  </style>

<script>
  // ------------------------------------------------------------
  // API BASE:
  // - On wenotpoor.com / www.wenotpoor.com => use same-origin /api
  // - On pages.dev (or anything else)      => call https://wenotpoor.com/api
  // This prevents accidental Pages HTML responses.
  // ------------------------------------------------------------
  function getApiBase() {
    const host = (window.location.hostname || "").toLowerCase();

    // optional override for debugging:
    // register.html?api=https://wenotpoor.com
    try{
      const url = new URL(window.location.href);
      const override = url.searchParams.get("api");
      if (override) return String(override).replace(/\/+$/,"");
    }catch(_){}

    if (host === "wenotpoor.com" || host === "www.wenotpoor.com") return "";
    return "https://wenotpoor.com";
  }

  const API_BASE = getApiBase();
  const REDEEM_ENDPOINT = API_BASE + "/api/book-codes/redeem";

  const $ = (id) => document.getElementById(id);

  function setMsg(text, isError = true) {
    const el = $("msg");
    el.textContent = text || "";
    el.style.color = isError ? "var(--danger, #FF2A2A)" : "var(--textOnDark, #FFD400)";
  }

  function normalizeCode(v){ return String(v||"").trim().toUpperCase(); }
  function normalizeEmail(v){ return String(v||"").trim().toLowerCase(); }
  function isValidEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
  function isValidBookCode(code){ return /^WNP-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code); }

  function stageAutoPayload({ email, code, data }) {
    const payload = {
      mode: "auto",
      path_type: "auto",
      email,
      code,
      member_id: data?.member_id || null,
      status: data?.status || null,
      needs_password: !!data?.needs_password,
      needs_oath: !!data?.needs_oath,
      needs_first_name: !!data?.needs_first_name,
      next_step: data?.next_step || null,
      already_registered: !!data?.already_registered,
      redeem_response: data || null
    };
    sessionStorage.setItem("wnp_payload", JSON.stringify(payload));
    sessionStorage.setItem("wnp_email", email);

    // ✅ Only persist email after a SUCCESSFUL redemption
    localStorage.setItem("wnp_email", email);
  }

  function routeAfterRedeem(data, email, code) {
    const status = String(data?.status || "").toLowerCase();
    if (status === "denied") return "denied.html";
    if (status === "pending") return "decision.html";

    if (data?.already_registered) {
      if (data?.needs_password) return `email-setup.html?email=${encodeURIComponent(email)}&mode=auto`;
      return `member-access.html?email=${encodeURIComponent(email)}`;
    }
    return `checkpoint.html?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}&mode=auto`;
  }

  function setBusy(isBusy){
    const btn = $("continueBtn");
    btn.disabled = isBusy;
    btn.textContent = isBusy ? "VERIFYING..." : "CONTINUE";
  }

  async function readJsonOrText(resp){
    const ct = (resp.headers.get("content-type") || "").toLowerCase();
    if (ct.includes("application/json")) {
      return { kind: "json", data: await resp.json().catch(() => ({})) };
    }
    const text = await resp.text().catch(() => "");
    return { kind: "text", text };
  }

  function friendlyApiError(respStatus, bodyText){
    const sample = String(bodyText || "").replace(/\s+/g," ").slice(0, 120);
    // This is the classic symptom you're seeing.
    if (sample.toLowerCase().includes("<!doctype html") || sample.toLowerCase().includes("<html")) {
      return `API routing error: /api returned HTML instead of JSON. Confirm your Worker route covers ${window.location.hostname}/api/* and that you’re testing on https://wenotpoor.com (not a pages.dev URL).`;
    }
    return `Could not verify code. (${respStatus})`;
  }

  async function redeem() {
    setMsg("");

    const code = normalizeCode($("code").value);
    const email = normalizeEmail($("email").value);

    if (!code) return setMsg("Book code required.");
    if (!isValidBookCode(code)) return setMsg("Code format must be WNP-XXXX-XXXX.");
    if (!email) return setMsg("Email required.");
    if (!isValidEmail(email)) return setMsg("Enter a valid email.");

    setBusy(true);

    try {
      const resp = await fetch(REDEEM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ code, email })
      });

      const parsed = await readJsonOrText(resp);

      if (!resp.ok) {
        if (parsed.kind === "json") {
          setMsg(parsed.data?.error || `Could not verify code. (${resp.status})`);
        } else {
          setMsg(friendlyApiError(resp.status, parsed.text));
        }
        setBusy(false);
        return;
      }

      if (parsed.kind !== "json") {
        setMsg("API error: expected JSON but received non-JSON response.", true);
        setBusy(false);
        return;
      }

      const data = parsed.data;
      stageAutoPayload({ email, code, data });
      window.location.href = routeAfterRedeem(data, email, code);

    } catch (_) {
      setMsg("Network error. Try again.");
      setBusy(false);
    }
  }

  (function initPrefill(){
    try{
      const url = new URL(window.location.href);
      const qEmail = normalizeEmail(url.searchParams.get("email") || "");
      const qCode = normalizeCode(url.searchParams.get("code") || "");
      if (qCode) $("code").value = qCode;
      if (qEmail) $("email").value = qEmail;

      // Prefill from storage only (does not save anything)
      if (!qEmail) {
        const carry = (sessionStorage.getItem("wnp_email") || localStorage.getItem("wnp_email") || "").trim();
        if (carry) $("email").value = normalizeEmail(carry);
      }
    } catch(_){}
  })();

  $("continueBtn").addEventListener("click", redeem);
  $("code").addEventListener("keydown", (e)=>{ if(e.key==="Enter") redeem(); });
  $("email").addEventListener("keydown", (e)=>{ if(e.key==="Enter") redeem(); });
</script>

</body>
</html>
